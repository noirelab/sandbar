[project]
name = "sandbar"
version = "0.1.0"
description = "River sandbar segmentation from Sentinel-2 imagery"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "odc-stac>=0.5.3",
    "openai>=3.31.0",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.9.0",
    "scipy>=1.18.1",
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
